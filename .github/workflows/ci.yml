name: CI

on:
  pull_request:
  push:
    branches:
      - dev

jobs:
  test-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore MajRadar.slnx
      - run: dotnet test MajRadar.slnx --no-restore -c Release
      - run: dotnet pack MajRadar.csproj --no-restore -c Release -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: MajRadar-nuget
          path: artifacts/*.nupkg

  play-majsimai-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TeamMajdata/MajSimai
          ref: fdb2a3e39d8997a0abbf8b4679062d854473cc77
          path: external/MajSimai
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: >-
          dotnet restore MajRadar.slnx
          -p:MajSimaiProject=${{ github.workspace }}/external/MajSimai/MajSimai.csproj
      - run: >-
          dotnet test MajRadar.slnx --no-restore -c Release
          -p:MajSimaiProject=${{ github.workspace }}/external/MajSimai/MajSimai.csproj
